name: Assign GPAD firmware version

on:
  pull_request_target:
    branches: ["main"]
    types: [closed]

permissions:
  contents: write

jobs:
  assign-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main after merge
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure version commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increment firmware version
        run: |
          set -euo pipefail

          python3 scripts/bump_gpad_firmware_version.py --from-ref HEAD

          if git diff --quiet -- Firmware/GPAD_API/FIRMWARE_VERSION; then
            echo "Firmware version is already current; nothing to commit."
            exit 0
          fi

          git add Firmware/GPAD_API/FIRMWARE_VERSION
          git commit -m "Bump GPAD firmware version"
          git push origin main
